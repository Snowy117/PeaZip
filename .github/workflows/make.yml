---
name: Make

on:
  schedule:
    - cron:  '0 0 1 * *'
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - sources

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: windows-latest
            arch: x86_64
          - os: windows-11-arm
            arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          source '.github/workflows/setup.sh'
          instantfpc '.github/workflows/make.pas' build

      - name: Build on Windows
        if: runner.os == 'Windows' && matrix.arch != 'aarch64'
        shell: powershell
        run: |
          pwsh -File '.github/workflows/setup.ps1'

      - name: Build on Windows (aarch64)
        if: runner.os == 'Windows' && matrix.arch == 'aarch64'
        shell: powershell
        run: |
          pwsh -File '.github/workflows/setup.ps1' -TargetCPU aarch64 -TargetOS win64

      - name: Smoke test (aarch64)
        if: runner.os == 'Windows' && matrix.arch == 'aarch64'
        shell: powershell
        run: |
          # verify ARM64 machine type (0xAA64) in the PE header
          function Test-ARM64($path) {
              $fs = [IO.File]::OpenRead($path)
              $br = New-Object IO.BinaryReader($fs)
              $null = $br.ReadBytes(0x3C)
              $fs.Position = $br.ReadUInt32() + 4
              $machine = $br.ReadUInt16()
              $br.Close()
              if ($machine -ne 0xAA64) { throw "$path is not ARM64 (0x$($machine.ToString('X4')))" }
              "ARM64 OK: $path"
          }
          foreach ($n in 'peazip.exe', 'pea.exe', 'dragdropfilesdll.dll') {
              $f = Get-ChildItem 'peazip-sources' -Recurse -Filter $n |
                  Select-Object -First 1
              if (-not $f) { throw "$n not found" }
              Test-ARM64 $f.FullName | Out-Host
          }

      - name: Stage portable tree (aarch64)
        if: runner.os == 'Windows' && matrix.arch == 'aarch64'
        shell: powershell
        run: |
          $Stage = 'peazip-win-arm64'
          New-Item -ItemType Directory -Force $Stage | Out-Null
          foreach ($n in 'peazip.exe', 'pea.exe') {
              $f = Get-ChildItem 'peazip-sources\dev' -Recurse -Filter $n |
                  Select-Object -First 1
              if (-not $f) { throw "$n not found" }
              Copy-Item $f.FullName $Stage
          }
          $dll = Get-ChildItem 'peazip-sources' -Recurse -Filter 'dragdropfilesdll.dll' |
              Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName $Stage }
          Copy-Item 'peazip-sources\res' -Destination (Join-Path $Stage 'res') -Recurse

      - name: Build installer (aarch64)
        if: runner.os == 'Windows' && matrix.arch == 'aarch64'
        shell: pwsh
        run: |
          $Stage = "$PWD\peazip-win-arm64"
          $Installer = 'peazip-sources\dev\installer'
          $Setup = Join-Path $Env:TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $Setup
          & $Setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART | Out-Null
          $Iscc = @(
              'C:\Program Files\Inno Setup 7\ISCC.exe',
              'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $Iscc) { throw 'ISCC.exe not found' }
          # compile the configuration wizard shipped as res\bin\Configure PeaZip.exe
          & $Iscc /O"$Stage\res\bin" /F'Configure PeaZip' "$Installer\peazip-setup_script-configure.iss"
          if ($LASTEXITCODE -ne 0) { throw 'configure script compilation failed' }
          # derive the ARM64 installer from the WIN64 one
          $iss = [IO.File]::ReadAllText("$Installer\peazip-setup_script_WIN64.iss")
          $iss = $iss.Replace('C:\input\peazip-11.3.0.WIN64', $Stage)
          $iss = $iss.Replace('C:\output\', "$PWD\")
          $iss = $iss.Replace('OutputBaseFilename=peazip-11.3.0.WIN64', 'OutputBaseFilename=peazip-11.3.0.WINARM64')
          $iss = $iss.Replace('AppVerName=PeaZip 11.3.0 (WIN64)', 'AppVerName=PeaZip 11.3.0 (WINARM64)')
          $iss = $iss.Replace('ArchitecturesInstallIn64BitMode=x64', 'ArchitecturesInstallIn64BitMode=arm64')
          $iss = $iss.Replace('ArchitecturesAllowed=x64', 'ArchitecturesAllowed=arm64')
          [IO.File]::WriteAllText("$Installer\peazip-setup_script_WINARM64.iss", $iss,
              [Text.UTF8Encoding]::new($true))
          & $Iscc "$Installer\peazip-setup_script_WINARM64.iss"
          if ($LASTEXITCODE -ne 0) { throw 'installer compilation failed' }

      - name: Upload artifacts (aarch64)
        if: runner.os == 'Windows' && matrix.arch == 'aarch64'
        shell: powershell
        run: |
          Compress-Archive -Path 'peazip-win-arm64' -DestinationPath 'peazip-win-arm64.zip'
          Get-ChildItem 'peazip-win-arm64.zip', 'peazip-11.3.0.WINARM64.exe' |
              Get-FileHash -Algorithm SHA256 | Format-List | Out-Host

      - name: Publish artifacts (aarch64)
        if: runner.os == 'Windows' && matrix.arch == 'aarch64'
        uses: actions/upload-artifact@v4
        with:
          name: peazip-win-arm64
          path: |
            peazip-win-arm64.zip
            peazip-11.3.0.WINARM64.exe
          if-no-files-found: error
